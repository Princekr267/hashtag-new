<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="transparent" />
  <g transform="translate(100, 100) scale(0.5)" filter="url(#glow)">
    <path d="M 120 40 L 90 360 M 280 40 L 250 360 M 40 120 L 360 120 M 40 280 L 360 280" 
          stroke="url(#neonGlow)" stroke-width="40" stroke-linecap="round" fill="none" />
  </g>
</svg>
